name: Windows release package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify allowlisted preview package
        shell: powershell
        run: |
          $version='0.1.0-alpha.2'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version=$env:GITHUB_REF_NAME.TrimStart('v') }
          .\Build-Public.ps1 -Version $version -OutputRoot "$env:RUNNER_TEMP\launcher-release"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-launchers-preview
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/launcher-release/*.zip
            ${{ runner.temp }}/launcher-release/*.sha256
            ${{ runner.temp }}/launcher-release/verification.txt
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: experimental-launchers-preview
          path: release-assets
      - name: Create draft experimental pre-release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets=@(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --prerelease --title "Experimental Runtime Launchers $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
